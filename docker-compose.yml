services:
  postgres-dev:
    # pgvector/pgvector en vez de postgres:16 pelada: la imagen oficial NO
    # trae la extensión vector (verificado: pg_available_extensions devolvía
    # 0 filas). Misma versión de Postgres, solo suma la extensión.
    image: pgvector/pgvector:pg16
    container_name: mitrabajo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitrabajo
      POSTGRES_PASSWORD: mitrabajo-dev-local
      POSTGRES_DB: mitrabajo_dev
    ports:
      - "5432:5432"
    volumes:
      - mitrabajo-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitrabajo -d mitrabajo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mitrabajo-postgres-dev-data:
