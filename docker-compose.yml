services:
  postgres-dev:
    image: postgres:16
    container_name: mitrabajo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: mitrabajo
      POSTGRES_PASSWORD: mitrabajo-dev-local
      POSTGRES_DB: mitrabajo_dev
    ports:
      - "5432:5432"
    volumes:
      - mitrabajo-postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mitrabajo -d mitrabajo_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mitrabajo-postgres-dev-data:
