<!doctype html><html lang="es"><head><meta charset="utf-8"><title>intro</title>
<style>
@font-face{font-family:Barlow;src:url(barlow-condensed-bold.woff2);font-weight:700}
@font-face{font-family:Manrope;src:url(manrope.woff2)}
html,body{margin:0;height:100%;background:#0d1626;overflow:hidden}
body{width:1920px;height:1080px;position:relative;color:#fff;font-family:Manrope,system-ui,sans-serif;
  background:radial-gradient(900px 480px at 78% -10%, rgba(78,178,210,.22), transparent 62%), linear-gradient(160deg,#0d1626 20%,#141f3a 75%,#2a3c6a)}
.colmena{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='56' height='97' viewBox='0 0 56 97'><path d='M28 0 L56 16 L56 48 L28 64 L0 48 L0 16 Z M28 64 L56 80 L56 97 M28 64 L0 80 L0 97' fill='none' stroke='white' stroke-width='1.2'/></svg>");background-size:56px 97px}
.c{position:absolute;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:34px}
.logo{height:150px;opacity:0;transform:translateY(18px) scale(.96);animation:in .9s cubic-bezier(.2,.8,.2,1) .1s forwards}
h1{margin:0;font:700 96px/1 Barlow;letter-spacing:4px;text-transform:uppercase;opacity:0;transform:translateY(22px);animation:in .8s cubic-bezier(.2,.8,.2,1) .55s forwards}
h1 b{color:#ffb020}
p{margin:0;font-size:30px;letter-spacing:.5px;color:#c8d2e4;opacity:0;animation:in .8s cubic-bezier(.2,.8,.2,1) 1.0s forwards}
.k{position:absolute;left:0;right:0;bottom:70px;text-align:center;font:700 44px/1 Barlow;letter-spacing:6px;color:#ffb020;opacity:0;animation:in .7s ease 1.5s forwards}
@keyframes in{to{opacity:1;transform:none}}
body.cierre .logo{animation-delay:.05s}
body.cierre h1{font-size:72px}
</style></head><body class="">
<div class="colmena"></div>
<div class="c">
  <img class="logo" src="logo.png" alt="">
  <h1 id="t1">Asistente <b>de trámites</b></h1>
  <p id="t2">De la idea al celular del afiliado</p>
</div>
<div class="k" id="k"></div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get('modo') === 'cierre') {
    document.body.classList.add('cierre');
    document.getElementById('t1').innerHTML = 'Sin programar. <b>Sin esfuerzo.</b>';
    document.getElementById('t2').textContent = 'Colm3na · la plataforma de los sindicatos de punta';
  }
</script>
</body></html>
