<svg viewBox="0 0 860 300" role="img" aria-label="La vuelta completa de un recibo: el afiliado lo sube, la IA lo lee, el motor lo valida contra las reglas del convenio y, si la persona quiere, llega al sindicato" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="ref-fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#7a8799"/></marker>
    <marker id="ref-fla" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="#e0951a"/></marker>
  </defs>

  <!-- Zonas -->
  <rect x="16" y="16" width="268" height="176" rx="12" fill="#eef2f6"/>
  <text x="32" y="38" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5b6778">TELÉFONO DEL AFILIADO</text>
  <rect x="300" y="16" width="544" height="176" rx="12" fill="#eef2f6"/>
  <text x="316" y="38" font-size="11" font-weight="700" letter-spacing="1.2" fill="#5b6778">SERVIDOR DE COLM3NA</text>

  <!-- Fila de pasos: cajas de 64 de alto, mismo ancho, separación 24 -->
  <rect x="32" y="56" width="236" height="64" rx="8" fill="#ffffff" stroke="#b8c3d1" stroke-width="1.25"/>
  <circle cx="52" cy="72" r="11" fill="#0a1421"/><text x="52" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="160" y="83" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#0a1421">Sube el recibo</text>
  <text x="160" y="102" text-anchor="middle" font-size="12" fill="#5b6778">foto o PDF</text>

  <rect x="316" y="56" width="160" height="64" rx="8" fill="#ffffff" stroke="#b8c3d1" stroke-width="1.25"/>
  <circle cx="336" cy="72" r="11" fill="#0a1421"/><text x="336" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="404" y="83" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#0a1421">La IA lee</text>
  <text x="404" y="102" text-anchor="middle" font-size="12" fill="#5b6778">líneas y totales</text>

  <rect x="500" y="56" width="160" height="64" rx="8" fill="#fff8ec" stroke="#e0951a" stroke-width="1.75"/>
  <circle cx="520" cy="72" r="11" fill="#0a1421"/><text x="520" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="588" y="83" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#0a1421">El motor valida</text>
  <text x="588" y="102" text-anchor="middle" font-size="12" fill="#5b6778">reglas del convenio</text>

  <rect x="684" y="56" width="144" height="64" rx="8" fill="#ffffff" stroke="#b8c3d1" stroke-width="1.25"/>
  <circle cx="704" cy="72" r="11" fill="#0a1421"/><text x="704" y="76" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="764" y="83" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#0a1421">Resultado</text>
  <text x="764" y="102" text-anchor="middle" font-size="12" fill="#5b6778">OK o diferencias</text>

  <!-- Flechas de la fila, con etiqueta arriba -->
  <line x1="270" y1="96" x2="314" y2="96" stroke="#7a8799" stroke-width="1.5" marker-end="url(#ref-fl)"/>
  <line x1="478" y1="96" x2="498" y2="96" stroke="#7a8799" stroke-width="1.5" marker-end="url(#ref-fl)"/>
  <line x1="662" y1="96" x2="682" y2="96" stroke="#7a8799" stroke-width="1.5" marker-end="url(#ref-fl)"/>
  <text x="292" y="88" text-anchor="middle" font-size="11.5" fill="#5b6778" paint-order="stroke" stroke="#eef2f6" stroke-width="4" stroke-linejoin="round">envía</text>

  <!-- Vuelta al teléfono y salida opcional al sindicato -->
  <path d="M764,122 L764,156 L200,156 L200,122" fill="none" stroke="#7a8799" stroke-width="1.5" marker-end="url(#ref-fl)"/>
  <text x="482" y="150" text-anchor="middle" font-size="11.5" fill="#5b6778" paint-order="stroke" stroke="#eef2f6" stroke-width="4" stroke-linejoin="round">la persona ve el resultado</text>

  <rect x="580" y="216" width="248" height="64" rx="8" fill="#0a1421"/>
  <text x="704" y="243" text-anchor="middle" font-family="Barlow Condensed" font-weight="700" font-size="16" fill="#ffffff">Panel del sindicato</text>
  <text x="704" y="262" text-anchor="middle" font-size="12" fill="#aeb9c8">agregados y, si lo envió, el recibo</text>
  <path d="M96,122 L96,248 L578,248" fill="none" stroke="#e0951a" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#ref-fla)"/>
  <text x="340" y="242" text-anchor="middle" font-size="11.5" fill="#5b6778" paint-order="stroke" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round">solo si la persona lo envía</text>
</svg>
