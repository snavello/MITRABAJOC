<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Colm3na — Verificación de identidad</title>
<style>
  @font-face {
    font-family: 'Barlow Condensed'; font-weight: 700; font-style: normal;
    src: url('/static/fonts/barlow-condensed-bold.woff2?v={{ sello_static('fonts/barlow-condensed-bold.woff2') }}') format('woff2');
  }
  /* Herramientas de /entornos (2026-11-11): Verificación de identidad. Tema CLARO
     y compacto: se usa con el celular en la mano, así que la foto y el botón de
     captura tienen que entrar sin scroll. Standalone, sin marca.css. El visor de
     la cámara sigue oscuro. El aro de espera es el mismo del análisis de recibo. */
  :root {
    --tinta: #15202e;
    --agua: {{ marca_plataforma.color_secundario if marca_plataforma else '#1a7a6b' }};
    --fondo: #eef3f8; --papel: #ffffff; --borde: #d5dde7; --suave: #5a6b7d;
    --ambar: #ffb020; --rojo: #e5383b; --rojo-oscuro: #c92a2d;
    --bien: #0e8a6d; --mal: #c9302c; --leve: #9a6b00;
    --fuente-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
    --mono: ui-monospace, 'Cascadia Mono', Consolas, monospace;
  }
  * { box-sizing:border-box; margin:0; font-family:system-ui,sans-serif; }
  html { background:var(--fondo); }
  body { min-height:100vh; padding:22px 16px 70px; color:var(--tinta);
    background:radial-gradient(900px 420px at 82% -10%, color-mix(in srgb, var(--agua) 12%, transparent), transparent 65%), var(--fondo); }
  a { color:#0b5fb3; }
  [hidden] { display:none !important; }
  .pagina { max-width:1180px; margin:0 auto; }
  .cab { margin-bottom:14px; }
  .cab .volver { font-size:13px; text-decoration:none; color:var(--suave); display:block; margin-bottom:4px; }
  .cab h1 { font-family:var(--fuente-display); font-size:40px; line-height:1; letter-spacing:2px; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:minmax(0,560px) 1fr; gap:18px; align-items:start; }
  @media (max-width:1000px) { .grid { grid-template-columns:1fr; } }
  .tarjeta { background:var(--papel); border:1px solid var(--borde); border-radius:16px; padding:18px; box-shadow:0 1px 3px rgba(21,32,46,.06); }
  .tarjeta + .tarjeta { margin-top:14px; }
  .tarjeta h2 { font-family:var(--fuente-display); font-size:22px; letter-spacing:1px; text-transform:uppercase; margin-bottom:12px; }
  .campo { display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
  .campo > span { font-size:12px; color:var(--suave); }
  .dos { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  input[type=text], input[type=date], select, textarea {
    width:100%; background:#fff; color:var(--tinta); border:1px solid #b9c5d3;
    border-radius:9px; padding:10px 11px; font-size:15px; }
  textarea { min-height:54px; resize:vertical; }
  input:focus-visible, button:focus-visible, select:focus-visible, summary:focus-visible { outline:2px solid #0b5fb3; outline-offset:1px; }
  .tilde { display:flex; align-items:flex-start; gap:9px; font-size:13.5px; margin-bottom:8px; line-height:1.3; }
  .tilde input { width:17px; height:17px; accent-color:#0b5fb3; margin-top:1px; flex:none; }
  .gasta { font-family:var(--mono); font-size:11px; color:var(--leve); margin-left:4px; }
  button { font-family:system-ui,sans-serif; }
  button.principal { background:var(--tinta); color:#fff; border:0; border-radius:10px; padding:12px 20px; font:700 15px system-ui; cursor:pointer; }
  button.principal:disabled { opacity:.4; cursor:not-allowed; }
  button.suave { background:#e4ebf3; color:var(--tinta); border:0; border-radius:10px; padding:12px 16px; font:600 14px system-ui; cursor:pointer; }
  button.chico { background:#e4ebf3; color:var(--tinta); border:0; border-radius:8px; padding:9px 14px; font:600 13.5px system-ui; cursor:pointer; }
  button.chico.fuerte { background:var(--tinta); color:#fff; }
  /* El botón de captura: grande y rojo, como el obturador. */
  button.captura { background:var(--rojo); color:#fff; border:0; border-radius:999px; padding:16px 34px; min-width:200px;
    font:800 19px system-ui; letter-spacing:.5px; cursor:pointer; box-shadow:0 4px 14px rgba(229,56,59,.4); }
  button.captura::before { content:'● '; }
  button.captura:hover:not(:disabled) { background:var(--rojo-oscuro); }
  button.captura:disabled { opacity:.35; cursor:not-allowed; box-shadow:none; }

  /* pasos: una sola línea, solo el actual lleva nombre */
  .pasos { display:flex; flex-wrap:nowrap; align-items:center; gap:6px; margin-bottom:14px; list-style:none; padding:0; }
  .pasos li { flex:none; font-size:12.5px; color:var(--suave); white-space:nowrap; }
  .pasos li.con { flex:1 1 8px; min-width:6px; height:1px; background:var(--borde); }
  .pasos li button { all:unset; display:flex; align-items:center; gap:6px; cursor:default; }
  .pasos li.salto button { cursor:pointer; }
  .pasos li .num { width:24px; height:24px; border-radius:50%; border:1px solid var(--borde); display:grid; place-items:center; font:700 11px var(--mono); flex:none; }
  .pasos li.actual { color:var(--tinta); font-weight:700; }
  .pasos li.actual .num { background:var(--tinta); color:#fff; border-color:var(--tinta); }
  .pasos li.hecho .num { background:rgba(14,138,109,.15); color:var(--bien); border-color:rgba(14,138,109,.5); }
  .navegacion { display:flex; gap:10px; justify-content:space-between; margin-top:14px; }

  /* visor de cámara (oscuro a propósito) */
  .visor { position:relative; width:100%; background:#05090f; border-radius:14px; overflow:hidden; border:1px solid var(--borde); color:#fff; }
  .visor.selfie { aspect-ratio:3/4; width:min(100%, 40vh); margin:0 auto; }
  @supports (height:1dvh) { .visor.selfie { width:min(100%, 40dvh); } }
  .visor.documento { aspect-ratio:4/3; }
  .visor video, .visor img.foto { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .visor.selfie video { transform:scaleX(-1); }       /* espejo solo en pantalla: lo que se envía no se invierte */
  .visor .vacio-visor { position:absolute; inset:0; display:grid; place-items:center; text-align:center; padding:20px;
    color:rgba(255,255,255,.7); font-size:13.5px; line-height:1.5; }
  .visor svg.guia { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
  .visor .pista { position:absolute; left:10px; right:10px; bottom:10px; text-align:center; font-size:13px; font-weight:600;
    padding:7px 10px; border-radius:9px; background:rgba(5,9,15,.8); }
  .visor .pista.ok { color:#3ecfae; }
  .visor .pista.atencion { color:#ffd27a; }
  .acciones { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; align-items:center; justify-content:center; }
  .nota-archivo { font-size:12.5px; color:var(--suave); width:100%; text-align:center; }
  details.opciones { margin-top:14px; border:1px solid var(--borde); border-radius:12px; padding:10px 14px; background:var(--papel); }
  details.opciones summary { cursor:pointer; font-size:13px; color:var(--suave); }
  details.opciones[open] summary { margin-bottom:10px; }

  /* la espera y el resultado: el mismo aro con reloj del análisis de recibo */
  .proceso { text-align:center; padding:6px 0 2px; }
  .aro { position:relative; width:148px; height:148px; margin:0 auto; }
  .aro svg.anillo { width:100%; height:100%; transform:rotate(-90deg); }
  .aro .pista-aro { fill:none; stroke:#e4ebf3; stroke-width:7; }
  .aro .avance { fill:none; stroke:var(--ambar); stroke-width:7; stroke-linecap:round;
    stroke-dasharray:414; stroke-dashoffset:414; transition:stroke-dashoffset .95s linear, stroke .3s; }
  .aro .centro { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; }
  .aro .centro .n { font-family:var(--mono); font-size:32px; font-weight:600; letter-spacing:-1px; }
  .aro .centro .et { font-size:9.5px; letter-spacing:2px; text-transform:uppercase; color:var(--suave); }
  .aro.ok .avance { stroke:var(--bien); stroke-dashoffset:0; }
  .aro.mal .avance { stroke:var(--mal); stroke-dashoffset:0; }
  .aro.rev .avance { stroke:#e0a000; stroke-dashoffset:0; }
  .aro .icono { width:84px; height:84px; }
  .aro .icono path { fill:none; stroke-width:5.5; stroke-linecap:round; stroke-linejoin:round;
    stroke-dasharray:64; stroke-dashoffset:64; animation:dibuja .55s .1s ease-out forwards; }
  .aro.ok .icono path { stroke:var(--bien); }
  .aro.mal .icono path { stroke:var(--mal); }
  .aro.rev .icono path { stroke:#e0a000; }
  @keyframes dibuja { to { stroke-dashoffset:0; } }
  .proceso h3 { font-family:var(--fuente-display); font-size:30px; letter-spacing:1px; text-transform:uppercase; margin-top:12px; }
  .proceso h3.ok { color:var(--bien); } .proceso h3.mal { color:var(--mal); } .proceso h3.rev { color:var(--leve); }
  .proceso .sub { font-size:13px; color:var(--suave); line-height:1.4; margin:4px auto 0; max-width:340px; }
  .fases { display:grid; gap:1px; background:var(--borde); border:1px solid var(--borde); border-radius:12px; overflow:hidden; margin:16px 0 0; text-align:left; }
  .fase { background:#fff; padding:10px 14px; display:flex; align-items:center; gap:11px; font-size:13.5px; color:var(--suave); }
  .fase .pt { width:9px; height:9px; border-radius:50%; background:var(--borde); flex:none; }
  .fase.hecha { color:var(--tinta); } .fase.hecha .pt { background:var(--bien); }
  .fase.activa { color:var(--tinta); font-weight:600; }
  .fase.activa .pt { background:var(--ambar); box-shadow:0 0 0 0 color-mix(in srgb, var(--ambar) 60%, transparent); animation:pulso 1.6s ease-out infinite; }
  @keyframes pulso { to { box-shadow:0 0 0 10px transparent; } }
  .fase .marca { margin-left:auto; font:800 15px system-ui; }
  .fase .marca.aprobado { color:var(--bien); } .fase .marca.rechazado, .fase .marca.error { color:var(--mal); }
  .fase .marca.revisar { color:#e0a000; } .fase .marca.sin_correr { color:var(--suave); font-weight:400; }
  .botones-resultado { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:14px; }
  @media (prefers-reduced-motion:reduce) { .fase.activa .pt { animation:none; } .aro .avance { transition:none; } .aro .icono path { animation:none; stroke-dashoffset:0; } }

  /* detalle del resultado */
  .veredicto { border-radius:14px; padding:14px 16px; margin-bottom:14px; border:1px solid var(--borde); }
  .veredicto.aprobable { border-color:rgba(14,138,109,.55); background:rgba(14,138,109,.1); }
  .veredicto.revisar { border-color:rgba(154,107,0,.5); background:rgba(255,176,32,.14); }
  .veredicto.rechazar { border-color:rgba(201,48,44,.5); background:rgba(229,56,59,.09); }
  .veredicto h3 { font-family:var(--fuente-display); font-size:30px; letter-spacing:1px; text-transform:uppercase; }
  .veredicto p { font-size:13px; color:var(--suave); margin-top:4px; line-height:1.4; }
  .paso { border:1px solid var(--borde); border-radius:12px; padding:12px 14px; margin-bottom:10px; }
  .paso .cab-paso { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .paso .cab-paso b { font-size:15px; }
  .chip { font-family:var(--mono); font-size:11.5px; padding:2px 9px; border-radius:999px; background:#e4ebf3; color:var(--suave); }
  .chip.aprobado { background:rgba(14,138,109,.16); color:var(--bien); }
  .chip.revisar { background:rgba(255,176,32,.25); color:var(--leve); }
  .chip.rechazado, .chip.error { background:rgba(229,56,59,.15); color:var(--mal); }
  .chip.sin_correr { opacity:.7; }
  .tiempo { font-family:var(--mono); font-size:11.5px; color:var(--suave); margin-left:auto; }
  .paso ul { list-style:none; margin-top:8px; font-size:13px; line-height:1.5; padding:0; }
  .paso li.ok::before { content:'✓ '; color:var(--bien); }
  .paso li.mal::before { content:'✗ '; color:var(--mal); }
  .paso li.nd::before { content:'– '; color:var(--suave); }
  .datos { font-family:var(--mono); font-size:12px; color:var(--suave); margin-top:6px; }
  .tabla { width:100%; border-collapse:collapse; font-size:13px; }
  .tabla th, .tabla td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--borde); vertical-align:top; }
  .tabla th { color:var(--suave); font-weight:600; font-size:12px; }
  .vacio { color:var(--suave); font-size:13px; padding:8px 0; }

  /* celular: todo más junto para que la foto entre sin scroll */
  @media (max-width:700px) {
    body { padding:10px 10px 40px; }
    .cab { margin-bottom:8px; }
    .cab h1 { font-size:22px; letter-spacing:1px; }
    .cab .volver { font-size:12px; margin-bottom:2px; }
    .tarjeta { padding:12px; border-radius:14px; }
    .pasos { margin-bottom:10px; }
    .navegacion { margin-top:10px; }
    button.captura { padding:14px 26px; min-width:170px; font-size:18px; }
  }
</style>
</head>
<body>
<div class="pagina">
  <div class="cab">
    <a class="volver" href="/entornos#herramientas">← Herramientas</a>
    <h1>Verificación de identidad</h1>
  </div>

  <div class="grid">
    <div>
      <div class="tarjeta" id="asistente">
        <ol class="pasos" id="indicador"></ol>

        <!-- 1. datos -->
        <section data-paso="datos">
          <form id="form-datos" autocomplete="off" novalidate>
            <label class="campo"><span>CUIL</span><input type="text" name="cuil" inputmode="numeric" placeholder="20-12345678-3" required></label>
            <div class="dos">
              <label class="campo"><span>DNI</span><input type="text" name="dni" inputmode="numeric" placeholder="12345678" required></label>
              <label class="campo"><span>Género (como figura en el DNI)</span>
                <select name="genero" required><option value="">—</option><option value="M">M</option><option value="F">F</option></select></label>
            </div>
            <div class="dos">
              <label class="campo"><span>Nombre/s</span><input type="text" name="nombre" required></label>
              <label class="campo"><span>Apellido/s</span><input type="text" name="apellido" required></label>
            </div>
            <label class="campo"><span>Fecha de nacimiento</span><input type="date" name="nacimiento" min="1900-01-01" required></label>
          </form>
          <p id="error-datos" class="vacio" style="color:var(--mal);" hidden></p>
        </section>

        <!-- 2. selfie -->
        <section data-paso="selfie" hidden><div data-captura="selfie"></div></section>
        <!-- 3. DNI frente -->
        <section data-paso="frente" hidden><div data-captura="frente"></div></section>
        <!-- 4. DNI dorso -->
        <section data-paso="dorso" hidden><div data-captura="dorso"></div></section>

        <!-- la espera y el resultado -->
        <section data-paso="proceso" hidden><div class="proceso" id="proceso"></div></section>

        <div class="navegacion" id="navegacion">
          <button class="suave" id="atras" type="button">← Atrás</button>
          <button class="principal" id="siguiente" type="button">Siguiente →</button>
        </div>
      </div>

      <details class="opciones">
        <summary>Opciones de prueba (qué pasos correr, nota)</summary>
        <div id="pasos"></div>
        <label class="campo"><span>Nota (opcional, sin datos personales)</span><textarea id="nota" placeholder="Ej.: selfie con poca luz"></textarea></label>
      </details>
    </div>

    <div>
      <div id="resultado" class="tarjeta"><h2>Detalle</h2><p class="vacio">Todavía no corriste ninguna verificación.</p></div>
      <div id="casos" class="tarjeta"><h2>Casos guardados</h2><div id="lista-casos"><p class="vacio">Leyendo…</p></div></div>
    </div>
  </div>
</div>

<script>
(function () {
  const API = {{ api|tojson }};
  const ESTADOS = {{ estados|tojson }};
  const NOMBRES = { aprobable: 'Aprobable', revisar: 'Revisar', rechazar: 'Rechazado' };
  const EXPLICA = {
    aprobable: 'Todo en verde. Pasa a la mesa del sindicato.',
    revisar: 'Algún paso no pudo decidir solo: lo mira una persona.',
    rechazar: 'Un paso rechazó la identidad.',
  };
  const FASES = { local: 'Controlando tus datos', documento: 'Leyendo el documento', vida: 'Prueba de vida',
                  cara: 'Comparando la cara', renaper: 'Consultando RENAPER' };
  const TOPES = { selfie: 5 * 1048576, frente: 10 * 1048576, dorso: 10 * 1048576 };
  const IA_ARO = 414;   // 2·PI·66, el perímetro del círculo del SVG

  function el(tag, props, ...hijos) {
    const n = document.createElement(tag);
    Object.assign(n, props || {});
    hijos.flat().forEach(h => n.append(h));
    return n;
  }
  function svg(tag, attrs) {
    const n = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.entries(attrs || {}).forEach(([k, v]) => n.setAttribute(k, v));
    return n;
  }

  // ===================================================== fotos tomadas
  const foto = { selfie: null, frente: null, dorso: null };   // {blob, url, nombre, pdf}
  const capturadores = {};

  // ---- medición liviana de la imagen (luz, nitidez, movimiento)
  const mini = document.createElement('canvas');
  function medir(fuente, w, h, anterior) {
    const ancho = 160, alto = Math.max(8, Math.round(ancho * h / w));
    mini.width = ancho; mini.height = alto;
    const ctx = mini.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(fuente, 0, 0, ancho, alto);
    const d = ctx.getImageData(0, 0, ancho, alto).data;
    const n = ancho * alto, g = new Float32Array(n);
    let suma = 0;
    for (let i = 0; i < n; i++) { g[i] = 0.299 * d[4 * i] + 0.587 * d[4 * i + 1] + 0.114 * d[4 * i + 2]; suma += g[i]; }
    let s = 0, s2 = 0, c = 0;
    for (let y = 1; y < alto - 1; y++) for (let x = 1; x < ancho - 1; x++) {
      const p = y * ancho + x, lap = 4 * g[p] - g[p - 1] - g[p + 1] - g[p - ancho] - g[p + ancho];
      s += lap; s2 += lap * lap; c++;
    }
    let mov = 0;
    if (anterior && anterior.length === n) { for (let i = 0; i < n; i++) mov += Math.abs(g[i] - anterior[i]); mov /= n; }
    return { media: suma / n, nitidez: s2 / c - (s / c) * (s / c), mov, g };
  }
  function consejo(m, modo) {
    if (m.media < 60) return { texto: 'Falta luz: buscá un lugar más iluminado.', ok: false };
    if (m.media > 215) return { texto: 'Hay demasiado brillo: evitá la luz directa o los reflejos.', ok: false };
    if (m.mov > 14) return { texto: 'Mantené el celular quieto.', ok: false };
    if (m.nitidez < 18) return { texto: modo === 'selfie' ? 'Se ve borrosa: acercate un poco y esperá a que enfoque.' : 'Se ve borroso: acercalo un poco y esperá a que enfoque.', ok: false };
    return { texto: 'Se ve bien: podés capturar.', ok: true };
  }

  // ---- un capturador por foto
  function capturador(clave, modo, permitePdf) {
    const cont = document.querySelector('[data-captura="' + clave + '"]');
    const visor = el('div', { className: 'visor ' + modo });
    const video = el('video', { playsInline: true, muted: true, autoplay: true });
    video.hidden = true;
    const imagen = el('img', { className: 'foto', alt: '' });
    imagen.hidden = true;
    const vacio = el('div', { className: 'vacio-visor', textContent: modo === 'selfie' ? 'Abrí la cámara para sacarte la selfie.' : 'Abrí la cámara para fotografiar el documento, o subí un archivo.' });
    const guia = svg('svg', { class: 'guia', viewBox: '0 0 100 100', preserveAspectRatio: 'none' });
    guia.style.display = 'none';
    if (modo === 'selfie') {
      guia.setAttribute('viewBox', '0 0 300 400');
      const mascara = svg('path', { d: 'M0 0H300V400H0Z M150 40 C 215 40 250 100 250 175 C 250 255 205 325 150 325 C 95 325 50 255 50 175 C 50 100 85 40 150 40Z',
        fill: 'rgba(5,9,15,.55)', 'fill-rule': 'evenodd' });
      const borde = svg('ellipse', { cx: 150, cy: 182, rx: 100, ry: 143, fill: 'none', stroke: 'rgba(255,255,255,.85)', 'stroke-width': 2.5, 'stroke-dasharray': '8 6' });
      guia.append(mascara, borde);
    } else {
      guia.setAttribute('viewBox', '0 0 400 300');
      const w = 340, h = Math.round(w / 1.586), x = (400 - w) / 2, y = (300 - h) / 2 - 8;
      const mascara = svg('path', { d: 'M0 0H400V300H0Z M' + (x + 14) + ' ' + y + 'H' + (x + w - 14) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + 14) +
        'V' + (y + h - 14) + 'Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w - 14) + ' ' + (y + h) + 'H' + (x + 14) + 'Q' + x + ' ' + (y + h) + ' ' + x + ' ' + (y + h - 14) +
        'V' + (y + 14) + 'Q' + x + ' ' + y + ' ' + (x + 14) + ' ' + y + 'Z', fill: 'rgba(5,9,15,.5)', 'fill-rule': 'evenodd' });
      const borde = svg('rect', { x, y, width: w, height: h, rx: 14, fill: 'none', stroke: 'rgba(255,255,255,.85)', 'stroke-width': 2.5, 'stroke-dasharray': '10 7' });
      guia.append(mascara, borde);
    }
    const pista = el('div', { className: 'pista' });
    pista.hidden = true;
    visor.append(vacio, video, imagen, guia, pista);

    const bCamara = el('button', { type: 'button', className: 'chico fuerte', textContent: 'Abrir cámara' });
    const bCapturar = el('button', { type: 'button', className: 'captura', textContent: 'Capturar' });
    const bRepetir = el('button', { type: 'button', className: 'chico', textContent: 'Repetir' });
    const archivo = el('input', { type: 'file', accept: permitePdf ? 'image/*,application/pdf' : 'image/*' });
    archivo.hidden = true;
    const bArchivo = el('button', { type: 'button', className: 'chico', textContent: permitePdf ? 'Subir archivo' : 'No tengo cámara: subir una foto' });
    const nota = el('span', { className: 'nota-archivo' });
    const acciones = el('div', { className: 'acciones' }, bCamara, bCapturar, bRepetir, bArchivo, nota, archivo);
    cont.append(visor, acciones);

    let flujo = null, cinta = null, previo = null;

    function vista(estado) {   // inicio | camara | listo
      video.hidden = estado !== 'camara';
      imagen.hidden = estado !== 'listo';
      vacio.hidden = estado !== 'inicio';
      guia.style.display = estado === 'camara' ? '' : 'none';
      pista.hidden = estado === 'inicio';
      bCamara.hidden = estado !== 'inicio';
      bCapturar.hidden = estado !== 'camara';
      bRepetir.hidden = estado !== 'listo';
      bArchivo.hidden = estado === 'listo';
    }
    function apagar() {
      if (cinta) { clearInterval(cinta); cinta = null; }
      if (flujo) { flujo.getTracks().forEach(t => t.stop()); flujo = null; }
      video.srcObject = null; previo = null;
    }
    function soltar() { if (foto[clave] && foto[clave].url) URL.revokeObjectURL(foto[clave].url); foto[clave] = null; }
    function listo(f, aviso) {
      soltar(); foto[clave] = f;
      vista('listo');
      if (f.pdf) { imagen.removeAttribute('src'); imagen.hidden = true; vacio.hidden = false; vacio.textContent = 'Archivo PDF: ' + f.nombre; }
      else { imagen.src = f.url; vacio.hidden = true; }
      pista.className = 'pista ' + (aviso && !aviso.ok ? 'atencion' : 'ok');
      pista.textContent = aviso ? aviso.texto : 'Lista.';
      nota.textContent = '';
      actualizarNavegacion();
    }

    async function abrir() {
      nota.textContent = '';
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        nota.textContent = 'Este navegador no deja usar la cámara (hace falta HTTPS). Subí un archivo.'; return;
      }
      try {
        flujo = await navigator.mediaDevices.getUserMedia({ audio: false, video: modo === 'selfie'
          ? { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }
          : { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
      } catch (e) {
        nota.textContent = e && e.name === 'NotAllowedError' ? 'Permiso de cámara denegado: habilitalo en el navegador o subí un archivo.'
          : 'No se pudo abrir la cámara (' + (e && e.name || 'error') + '). Subí un archivo.';
        return;
      }
      video.srcObject = flujo;
      try { await video.play(); } catch (e) { /* el autoplay la inicia igual */ }
      vista('camara');
      bCapturar.disabled = true;      // se habilita con la primera imagen real: un fotograma negro no sirve
      pista.className = 'pista'; pista.textContent = 'Buscando la imagen…';
      cinta = setInterval(() => {
        if (!video.videoWidth || video.readyState < 2) return;
        const m = medir(video, video.videoWidth, video.videoHeight, previo);
        previo = m.g;
        if (m.media > 8) bCapturar.disabled = false;
        const c = consejo(m, modo);
        pista.className = 'pista ' + (c.ok ? 'ok' : 'atencion'); pista.textContent = c.texto;
      }, 450);
    }
    function capturar() {
      if (!video.videoWidth) return;
      const w = video.videoWidth, h = video.videoHeight, k = Math.min(1, 1600 / Math.max(w, h));
      const lienzo = document.createElement('canvas');
      lienzo.width = Math.round(w * k); lienzo.height = Math.round(h * k);
      lienzo.getContext('2d').drawImage(video, 0, 0, lienzo.width, lienzo.height);   // sin espejo: se envía como la ve la cámara
      const m = medir(lienzo, lienzo.width, lienzo.height, null);
      if (m.media <= 8) { nota.textContent = 'La imagen salió negra: esperá un segundo y volvé a capturar.'; bCapturar.disabled = true; return; }
      const c = consejo({ ...m, mov: 0 }, modo);
      lienzo.toBlob(blob => {
        if (!blob) { nota.textContent = 'No se pudo tomar la foto. Probá de nuevo.'; return; }
        apagar();
        listo({ blob, url: URL.createObjectURL(blob), nombre: clave + '.jpg', pdf: false }, c);
      }, 'image/jpeg', 0.9);
    }
    function repetir() { soltar(); apagar(); vista('inicio'); actualizarNavegacion(); }

    bCamara.addEventListener('click', abrir);
    bCapturar.addEventListener('click', capturar);
    bRepetir.addEventListener('click', repetir);
    bArchivo.addEventListener('click', () => archivo.click());
    archivo.addEventListener('change', () => {
      const f = archivo.files[0]; archivo.value = '';
      if (!f) return;
      const pdf = f.type === 'application/pdf';
      if (pdf && !permitePdf) { nota.textContent = 'La selfie tiene que ser una imagen.'; return; }
      if (!pdf && !/^image\/(jpeg|png|webp)$/.test(f.type)) { nota.textContent = 'Usá una imagen JPG, PNG o WebP' + (permitePdf ? ' o un PDF.' : '.'); return; }
      if (f.size > TOPES[clave]) { nota.textContent = 'El archivo pesa más de ' + (TOPES[clave] / 1048576) + ' MB.'; return; }
      apagar();
      if (pdf) { listo({ blob: f, url: null, nombre: f.name, pdf: true }, { texto: 'PDF cargado.', ok: true }); return; }
      const url = URL.createObjectURL(f);
      const prueba = new Image();
      prueba.onload = () => {
        const m = medir(prueba, prueba.naturalWidth, prueba.naturalHeight, null);
        listo({ blob: f, url, nombre: f.name, pdf: false }, consejo({ ...m, mov: 0 }, modo));
      };
      prueba.onerror = () => { URL.revokeObjectURL(url); nota.textContent = 'No se pudo leer la imagen.'; };
      prueba.src = url;
    });
    vista('inicio');
    return { apagar, repetir };
  }
  capturadores.selfie = capturador('selfie', 'selfie', false);
  capturadores.frente = capturador('frente', 'documento', true);
  capturadores.dorso = capturador('dorso', 'documento', true);

  // ===================================================== pasos del asistente
  const ORDEN = [
    { clave: 'datos', nombre: 'Datos' }, { clave: 'selfie', nombre: 'Selfie' },
    { clave: 'frente', nombre: 'DNI frente' }, { clave: 'dorso', nombre: 'DNI dorso' }];
  let actual = 0;
  let corrigiendo = false;          // viene de un resultado: se conservan datos y fotos
  let ocupado = false;              // verificando: no se toca nada
  const secciones = Object.fromEntries([...document.querySelectorAll('[data-paso]')].map(s => [s.dataset.paso, s]));
  const indicador = document.getElementById('indicador');
  const navegacion = document.getElementById('navegacion');
  const bAtras = document.getElementById('atras'), bSiguiente = document.getElementById('siguiente');
  const formDatos = document.getElementById('form-datos');

  function datosCompletos() { return [...formDatos.elements].every(e => !e.required || e.value.trim()); }
  function puedeAvanzar() {
    const c = ORDEN[actual].clave;
    if (c === 'selfie') return !!foto.selfie;
    if (c === 'frente') return !!foto.frente;
    return true;
  }
  function actualizarNavegacion() {
    bAtras.hidden = actual === 0;
    bSiguiente.disabled = !puedeAvanzar();
    const c = ORDEN[actual].clave;
    const volver = corrigiendo && foto.selfie && foto.frente && c === 'datos';
    bSiguiente.textContent = volver ? 'Volver a verificar →'
      : c === 'dorso' ? (foto.dorso ? 'Verificar →' : 'Omitir y verificar →') : 'Siguiente →';
  }
  // Se puede saltar a un paso si lo anterior que hace falta ya está (datos completos, selfie, frente).
  function alcanzable(i) {
    if (i >= 1 && !datosCompletos()) return false;
    if (i >= 2 && !foto.selfie) return false;
    if (i >= 3 && !foto.frente) return false;
    return true;
  }
  function dibujarIndicador() {
    const hijos = [];
    ORDEN.forEach((p, i) => {
      const salto = i !== actual && alcanzable(i);
      const b = el('button', { type: 'button', disabled: !salto, 'aria-label': p.nombre },
        el('span', { className: 'num', textContent: i < actual ? '✓' : String(i + 1) }), i === actual ? p.nombre : '');
      b.addEventListener('click', () => ir(i));
      if (i) hijos.push(el('li', { className: 'con' }));
      hijos.push(el('li', { className: (i === actual ? 'actual' : i < actual ? 'hecho' : '') + (salto ? ' salto' : '') }, b));
    });
    indicador.replaceChildren(...hijos);
  }
  function mostrar(clave) {
    Object.entries(secciones).forEach(([k, s]) => { s.hidden = k !== clave; });
  }
  function ir(i) {
    if (ocupado) return;
    Object.values(capturadores).forEach(c => c.apagar());
    actual = Math.max(0, Math.min(ORDEN.length - 1, i));
    mostrar(ORDEN[actual].clave);
    indicador.hidden = false; navegacion.hidden = false;
    dibujarIndicador(); actualizarNavegacion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
  bAtras.addEventListener('click', () => ir(actual - 1));
  bSiguiente.addEventListener('click', () => {
    const c = ORDEN[actual].clave;
    if (c === 'datos') {
      const e = document.getElementById('error-datos');
      if (!datosCompletos()) { e.hidden = false; e.textContent = 'Completá todos los datos para seguir.'; return; }
      e.hidden = true;
      if (corrigiendo && foto.selfie && foto.frente) { verificar(); return; }
    }
    if (c === 'dorso') { verificar(); return; }
    ir(actual + 1);
  });
  formDatos.addEventListener('submit', ev => ev.preventDefault());
  formDatos.addEventListener('input', () => { document.getElementById('error-datos').hidden = true; });

  // ===================================================== pasos de prueba
  let pasosDef = [];
  fetch(API + '/estado', { cache: 'no-store' }).then(r => r.json()).then(d => {
    pasosDef = d.pasos;
    const caja = document.getElementById('pasos');
    d.pasos.forEach(p => {
      const cb = el('input', { type: 'checkbox', value: p.clave, checked: true });
      cb.dataset.opcion = p.clave;
      caja.append(el('label', { className: 'tilde' }, cb, el('span', {}, p.nombre, p.gasta ? el('span', { className: 'gasta', textContent: 'paga' }) : '')));
    });
  });
  function pasosElegidos() {
    const marcados = [...document.querySelectorAll('input[data-opcion]:checked')].map(cb => cb.value);
    return marcados.length || pasosDef.length ? marcados : Object.keys(FASES);
  }

  // ===================================================== la espera y el resultado
  let cronometro = null;
  function nuevoAro() {
    const anillo = svg('svg', { class: 'anillo', viewBox: '0 0 148 148', 'aria-hidden': 'true' });
    anillo.append(svg('circle', { class: 'pista-aro', cx: 74, cy: 74, r: 66 }), svg('circle', { class: 'avance', cx: 74, cy: 74, r: 66 }));
    return el('div', { className: 'aro' }, anillo,
      el('div', { className: 'centro' }, el('span', { className: 'n', textContent: '00:00' }), el('span', { className: 'et', textContent: 'Segundos' })));
  }
  function icono(tipo) {   // ok | mal | rev
    const s = svg('svg', { class: 'icono', viewBox: '0 0 52 52', 'aria-hidden': 'true' });
    if (tipo === 'ok') s.append(svg('path', { d: 'M12 27 L22 37 L40 15' }));
    else if (tipo === 'mal') s.append(svg('path', { d: 'M14 14 L38 38' }), svg('path', { d: 'M38 14 L14 38' }));
    else s.append(svg('path', { d: 'M26 11 L26 29' }), svg('path', { d: 'M26 39 L26 39.4' }));
    return s;
  }
  function pararCronometro() { if (cronometro) { clearInterval(cronometro); cronometro = null; } }

  function mostrarProceso(pasos) {
    ocupado = true;
    Object.values(capturadores).forEach(c => c.apagar());
    mostrar('proceso');
    indicador.hidden = true; navegacion.hidden = true;
    const caja = document.getElementById('proceso');
    const aro = nuevoAro();
    const fases = el('div', { className: 'fases' }, pasos.map((c, i) => el('div', { className: 'fase' + (i === 0 ? ' activa' : '') },
      el('span', { className: 'pt' }), el('span', { textContent: FASES[c] || c }))));
    caja.replaceChildren(aro, el('h3', { textContent: 'Verificando…' }), el('p', { className: 'sub', textContent: 'No cierres esta pantalla.' }), fases);
    window.scrollTo({ top: 0 });
    const n = aro.querySelector('.n'), avance = aro.querySelector('.avance');
    let s = 0;
    const mmss = v => String(Math.floor(v / 60)).padStart(2, '0') + ':' + String(v % 60).padStart(2, '0');
    pararCronometro();
    const tic = () => {
      n.textContent = mmss(s);
      avance.style.strokeDashoffset = IA_ARO - IA_ARO * ((s % 45) / 45);
      const fase = Math.min(pasos.length - 1, Math.floor(s / 2));
      fases.querySelectorAll('.fase').forEach((e, i) => { e.classList.toggle('activa', i === fase); e.classList.toggle('hecha', i < fase); });
      s++;
    };
    tic(); cronometro = setInterval(tic, 1000);
  }

  function botonesFinales(caja) {
    const corregir = el('button', { type: 'button', className: 'principal', textContent: 'Corregir datos y volver a verificar' });
    corregir.addEventListener('click', () => { ocupado = false; corrigiendo = true; ir(0); });
    const otra = el('button', { type: 'button', className: 'suave', textContent: 'Empezar de cero' });
    otra.addEventListener('click', () => { ocupado = false; nueva(); });
    caja.append(el('div', { className: 'botones-resultado' }, corregir, otra));
  }

  function finalizar(r) {
    pararCronometro();
    ocupado = false;
    const v = r.veredicto;
    const clase = v.resultado === 'aprobable' ? 'ok' : v.resultado === 'rechazar' ? 'mal' : 'rev';
    const caja = document.getElementById('proceso');
    const aro = nuevoAro();
    aro.className = 'aro ' + clase;
    aro.querySelector('.centro').replaceChildren(icono(clase));
    const lista = el('div', { className: 'fases' }, r.pasos.map(p => {
      const e = v.estados[p.clave];
      const simbolo = e === 'aprobado' ? '✓' : e === 'rechazado' || e === 'error' ? '✗' : e === 'revisar' ? '!' : '–';
      return el('div', { className: 'fase' + (e === 'sin_correr' ? '' : ' hecha') },
        el('span', { className: 'pt' }), el('span', { textContent: FASES[p.clave] || p.clave }),
        el('span', { className: 'marca ' + e, textContent: simbolo }));
    }));
    const motivo = (v.motivos && v.motivos[0]) || EXPLICA[v.resultado];
    caja.replaceChildren(aro, el('h3', { className: clase, textContent: NOMBRES[v.resultado] }),
      el('p', { className: 'sub', textContent: motivo + ' · ' + (r.ms / 1000).toFixed(1) + ' s' + (r.sandbox ? ' · SANDBOX' : '') }), lista);
    botonesFinales(caja);
    window.scrollTo({ top: 0 });   // el ícono grande se ve sin bajar
  }
  function finalizarError(mensaje) {
    pararCronometro();
    ocupado = false;
    const caja = document.getElementById('proceso');
    const aro = nuevoAro();
    aro.className = 'aro mal';
    aro.querySelector('.centro').replaceChildren(icono('mal'));
    caja.replaceChildren(aro, el('h3', { className: 'mal', textContent: 'No se pudo verificar' }), el('p', { className: 'sub', textContent: mensaje }));
    botonesFinales(caja);
  }

  // ---- el detalle completo, en la tarjeta de al lado (o debajo en el celular)
  function dibujarDetalle(r) {
    const caja = document.getElementById('resultado');
    caja.replaceChildren(el('h2', { textContent: 'Detalle' }));
    const v = r.veredicto;
    const cab = el('div', { className: 'veredicto ' + v.resultado },
      el('h3', { textContent: NOMBRES[v.resultado] }),
      el('p', { textContent: EXPLICA[v.resultado] + ' · ' + (r.ms / 1000).toFixed(1) + ' s · ' + r.llamadas_pagas + ' llamada(s) paga(s)' + (r.sandbox ? ' · SANDBOX' : '') }));
    if (v.motivos.length) cab.append(el('p', {}, v.motivos.join(' ')));
    cab.append(el('p', { textContent: 'Intentos pagos de esta persona en la hora: ' + r.intentos.usados + ' de ' + r.intentos.tope }));
    caja.append(cab);
    const nombres = Object.fromEntries(pasosDef.map(p => [p.clave, p.nombre]));
    r.pasos.forEach(p => {
      const estado = v.estados[p.clave];
      const c = el('div', { className: 'paso' },
        el('div', { className: 'cab-paso' },
          el('b', { textContent: nombres[p.clave] || p.clave }),
          el('span', { className: 'chip ' + estado, textContent: estado.replace('_', ' ') }),
          el('span', { className: 'tiempo', textContent: p.omitido ? '' : (p.ms || 0) + ' ms' })));
      if (p.error) c.append(el('div', { className: 'datos', textContent: p.error }));
      if (p.omitido) c.append(el('div', { className: 'datos', textContent: p.motivo }));
      if (p.chequeos && p.chequeos.length) {
        const ul = el('ul');
        p.chequeos.forEach(k => ul.append(el('li', { className: k.ok === true ? 'ok' : k.ok === false ? 'mal' : 'nd', textContent: k.detalle })));
        c.append(ul);
      }
      const datos = [];
      if (p.estado) datos.push('estado: ' + p.estado);
      if (p.coincidencia) datos.push('coincidencia: ' + p.coincidencia);
      if (p.puntaje !== undefined && p.puntaje !== null) datos.push('puntaje: ' + p.puntaje);
      if (p.alertas && p.alertas.length) datos.push('alertas: ' + p.alertas.join(', '));
      if (datos.length) c.append(el('div', { className: 'datos', textContent: datos.join(' · ') }));
      caja.append(c);
    });
  }

  function nueva() {
    corrigiendo = false;
    ['selfie', 'frente', 'dorso'].forEach(k => capturadores[k].repetir());
    formDatos.reset();
    document.getElementById('nota').value = '';
    document.getElementById('resultado').replaceChildren(el('h2', { textContent: 'Detalle' }), el('p', { className: 'vacio', textContent: 'Todavía no corriste ninguna verificación.' }));
    ir(0);
  }

  // ===================================================== enviar
  async function verificar() {
    if (ocupado) return;
    if (!datosCompletos() || !foto.selfie || !foto.frente) { ir(0); return; }
    const fd = new FormData(formDatos);
    fd.append('selfie', foto.selfie.blob, foto.selfie.nombre);
    fd.append('frente', foto.frente.blob, foto.frente.nombre);
    if (foto.dorso) fd.append('dorso', foto.dorso.blob, foto.dorso.nombre);
    const pasos = pasosElegidos();
    pasos.forEach(c => fd.append('pasos', c));
    fd.append('nota', document.getElementById('nota').value);
    mostrarProceso(pasos);
    try {
      const r = await fetch(API + '/verificar', { method: 'POST', body: fd });
      let d = null;
      try { d = await r.json(); } catch (e) { /* respuesta que no es JSON */ }
      if (!r.ok) throw new Error((d && d.detail) || ('El servidor contestó ' + r.status));
      dibujarDetalle(d);
      finalizar(d);
      cargarCasos();
    } catch (e) {
      finalizarError(e.message);
    }
  }

  // ===================================================== casos guardados
  function cargarCasos() {
    fetch(API + '/casos', { cache: 'no-store' }).then(r => r.json()).then(d => {
      const caja = document.getElementById('lista-casos');
      if (!d.casos.length) { caja.replaceChildren(el('p', { className: 'vacio', textContent: 'Todavía no hay casos guardados.' })); return; }
      const t = el('table', { className: 'tabla' }, el('thead', {}, el('tr', {}, ['#', 'Cuándo', 'Resultado', 'Modo', 'Pagas', 'Estado', 'Nota'].map(h => el('th', { textContent: h })))));
      const cuerpo = el('tbody');
      d.casos.forEach(c => {
        const sel = el('select', {}, ESTADOS.map(e => el('option', { value: e, textContent: e, selected: e === c.estado })));
        sel.addEventListener('change', () => fetch(API + '/casos/' + c.id + '/estado', {
          method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ estado: sel.value }) }));
        cuerpo.append(el('tr', {},
          el('td', { textContent: c.id }), el('td', { textContent: c.creado }),
          el('td', { textContent: NOMBRES[c.veredicto] || '—', title: (c.motivos || []).join(' ') }),
          el('td', { textContent: c.modo }), el('td', { textContent: c.llamadas_pagas }),
          el('td', {}, sel), el('td', { textContent: c.nota })));
      });
      t.append(cuerpo);
      caja.replaceChildren(t);
    });
  }
  cargarCasos();
  window.addEventListener('pagehide', () => Object.values(capturadores).forEach(c => c.apagar()));
  ir(0);
})();
</script>
</body>
</html>
