<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colm3na — Sala de mando</title>
<style>
@font-face{font-family:"Barlow Condensed";src:url('/static/fonts/barlow-condensed-bold.woff2?v={{ sello_static('fonts/barlow-condensed-bold.woff2') }}') format('woff2');font-weight:700}
:root{
  --noche:#0a1421; --noche2:#0f1c2e; --noche3:#16263c; --linea:#22344d;
  --texto:#e8eef7; --texto2:#8ea0bb; --texto3:#5f7597;
  --miel:#f2b234; --cian:#6fe3ff; --verde:#3ec9a7; --rojo:#ff4d5a; --violeta:#b3b2e8; --rosa:#ff6ab0; --gris:#9fb0c8;
  --cond:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,Consolas,"SF Mono",monospace;
  --halo:#3ec9a7; --neon:#f2b234;
}
*{box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{margin:0;background:var(--noche);color:var(--texto);font:14px/1.45 var(--body)}
/* Todo entra en la ventana (2026-09-21): cabecera y tarjetas miden lo suyo y el
   radar se queda con el resto, con el dibujo escalado para caber entero. Antes la
   página medía más que la ventana y, embebida, el borde inferior quedaba afuera. */
.marco{height:100vh;display:flex;flex-direction:column;padding:10px 22px 8px;{% if embebida %}padding-top:6px;{% endif %}}
.cuerpo{flex:1;min-height:0;display:flex;flex-direction:column}
body.solo-radar .marco{padding:0}
body.solo-radar header, body.solo-radar .tiles, body.solo-radar .pie{display:none}
body.solo-radar .radar{border-radius:0;border:0}
header{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--linea);padding-bottom:8px}
header .marca{display:flex;align-items:center;gap:14px;min-width:0}
header .marca img{display:block;height:30px;width:auto;max-width:150px;object-fit:contain}
h1{margin:0;font:700 28px/1 var(--cond);letter-spacing:.02em;text-transform:uppercase;white-space:nowrap}
h1 em{font-style:normal;color:var(--miel)}
/* Botón circular de volver, flotante abajo a la derecha (pedido de Sd, 2026-09-21).
   Embebida en la landing le avisa al padre que cierre la capa; suelta, vuelve a /entornos. */
.volver{position:fixed;right:22px;bottom:22px;z-index:70;width:58px;height:58px;border-radius:50%;border:2px solid var(--miel);background:#0f1c2e;color:var(--miel);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(242,178,52,.12);transition:transform .15s,background .15s}
.volver:hover{transform:scale(1.06);background:var(--miel);color:#1a1200}
.volver svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.volver span{position:absolute;right:68px;top:50%;transform:translateY(-50%);white-space:nowrap;font:700 12px var(--cond);letter-spacing:.14em;text-transform:uppercase;color:var(--texto2);opacity:0;transition:opacity .15s;pointer-events:none}
.volver:hover span{opacity:1}
.volver.pantalla{bottom:92px;width:48px;height:48px;border-color:var(--cian);color:var(--cian);box-shadow:0 10px 30px rgba(0,0,0,.6),0 0 0 6px rgba(111,227,255,.1)}
.volver.pantalla:hover{background:var(--cian);color:#0a1421}
.volver.pantalla svg{width:22px;height:22px}
.volver.pantalla span{right:58px}
body.en-fullscreen .volver.pantalla{display:none}
.estado-ctl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--texto2);letter-spacing:.1em;text-transform:uppercase}
.estado-ctl button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:var(--c);opacity:.45}
.estado-ctl button.on{opacity:1;border-color:#fff;box-shadow:0 0 10px var(--c)}
.estado-ctl span{margin-left:6px;font:700 15px var(--cond);color:var(--halo);letter-spacing:.06em}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:5px;margin:6px 0}
.tile.neg::before{background:var(--cian)} .tile.neg b{color:var(--cian)}
/* Compactos (2026-09-21): dos líneas fijas por indicador. La segunda se corta con
   puntos suspensivos y el detalle completo sale en una burbuja al pasar el mouse. */
.tile{background:var(--noche2);border:1px solid var(--linea);border-radius:8px;padding:4px 8px 5px 10px;position:relative;line-height:1.15;min-width:0;cursor:default}
.tile::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;background:var(--miel);border-radius:2px}
.tile small{display:inline-block;color:var(--texto3);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-right:6px;vertical-align:baseline}
.tile b{font:700 18px/1 var(--cond);letter-spacing:.02em;vertical-align:baseline}
.tile span{display:block;font:10px var(--mono);color:var(--texto2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tile:hover{border-color:#3a4f70}
.burbuja{position:fixed;z-index:60;max-width:360px;background:#0f1c2e;border:1px solid #3a4f70;border-radius:8px;padding:8px 11px;font-size:12px;line-height:1.45;color:var(--texto);box-shadow:0 12px 30px rgba(0,0,0,.55);pointer-events:none;white-space:pre-line;display:none}
.burbuja b{color:var(--miel);font-weight:600}
.tile.ok b{color:var(--halo)} .tile.alerta::before{background:var(--rojo)} .tile.alerta b{color:var(--rojo)}
.radar{position:relative;flex:1;min-height:0;border:1px solid var(--linea);border-radius:14px;overflow:hidden;
  background:radial-gradient(ellipse at 50% 40%, #12223a 0%, var(--noche) 70%);
  box-shadow:inset 0 0 140px -50px var(--halo), 0 0 60px -30px var(--halo);transition:box-shadow .8s}
.radar::before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:40px 40px;pointer-events:none}
.barrido{position:absolute;inset:-40%;background:conic-gradient(from 0deg, transparent 0 80%, color-mix(in srgb,var(--halo) 12%,transparent) 92%, color-mix(in srgb,var(--halo) 32%,transparent) 100%);animation:girar 14s linear infinite;pointer-events:none;mix-blend-mode:screen;transition:background .8s}
.foco{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .4s;mix-blend-mode:screen;
  background:radial-gradient(180px 180px at var(--mx,50%) var(--my,50%), rgba(255,255,255,.085), rgba(255,255,255,.03) 45%, transparent 70%)}
.radar.con-foco .foco{opacity:1}
.radar[data-estado="rojo"] .barrido{animation-duration:6s} .radar[data-estado="violeta"] .barrido{animation-duration:30s;opacity:.6}
.radar[data-estado="violeta"] svg{filter:saturate(.4)}
@keyframes girar{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.barrido{animation:none}}
svg#svg{position:relative;width:100%;height:100%;display:block}
svg text{font-family:var(--body)}
.ico{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.zona-t{font:700 11px var(--cond);letter-spacing:.2em;text-transform:uppercase}
.nodo{cursor:pointer}
.nodo > rect.caja{fill:#0f1c2e;stroke:#2a3e5a;stroke-width:1.2;transition:stroke .2s}
.nodo.rack > rect.caja{fill:#0c1728;stroke:#33507a}
.nodo.planeado > rect.caja{stroke-dasharray:6 5;stroke:#4a5b74}
.nodo.manual > rect.caja{stroke-dasharray:2 4}
.nodo:hover > rect.caja, .nodo.fijo > rect.caja{stroke:var(--miel);stroke-width:2}
.nodo.zoom > rect.caja{filter:drop-shadow(0 14px 26px rgba(0,0,0,.75))}
.nodo text.t{font:700 15px var(--cond);fill:#f4f7fb;letter-spacing:.04em;text-transform:uppercase}
.nodo text.s{font:10.5px var(--body);fill:var(--texto2)}
.nodo text.k{font:9.5px var(--body);fill:var(--miel);letter-spacing:.14em;text-transform:uppercase}
.nodo text.chip{font:10.5px var(--body);fill:var(--texto)}
.nodo.chipn > rect.caja{fill:#0a1421;stroke:#2a3e5a}
.ins{fill:#101d31;stroke:#2a3e5a}
.a-label{fill:var(--texto2);font-size:10px} .a-labelbg{fill:#0b1526;opacity:.95}
.play{cursor:pointer} .play:hover circle{filter:drop-shadow(0 0 6px var(--cian))}
/* neón */
.neon > rect.caja{stroke:var(--neon)!important;stroke-width:3!important;filter:drop-shadow(0 0 6px var(--neon)) drop-shadow(0 0 16px var(--neon))}
.paso > rect.caja{stroke:var(--neon)!important;stroke-width:2!important;filter:drop-shadow(0 0 5px var(--neon))}
path.neon{stroke:var(--neon)!important;stroke-width:3.5!important;opacity:1!important;filter:drop-shadow(0 0 5px var(--neon));stroke-dasharray:10 6!important;animation:fluir .5s linear infinite}
path.paso{stroke:var(--neon)!important;stroke-width:2.4!important;opacity:1!important}
@keyframes fluir{from{stroke-dashoffset:32}to{stroke-dashoffset:0}}
svg.animando .nodo:not(.neon):not(.paso) > rect.caja{opacity:.5}
/* ficha */
/* La ficha FLOTA sobre el radar (pedido de Sd, 2026-09-21): aparece al pasar el mouse
   por una caja, del lado contrario a la caja para no taparla, y se queda al hacer clic. */
aside{position:fixed;top:70px;width:340px;max-height:calc(100vh - 110px);overflow:auto;z-index:65;display:none;
  background:rgba(15,28,46,.96);border:1px solid #3a4f70;border-radius:14px;padding:14px 18px;box-shadow:0 18px 50px rgba(0,0,0,.6);backdrop-filter:blur(6px);pointer-events:none}
aside.visible{display:block} aside.fija{pointer-events:auto;border-color:var(--miel)}
/* Los tres recorridos: botones circulares de play, cada uno de su color, con un
   rótulo corto debajo. Viven ADENTRO del radar (abajo a la izquierda), así siguen
   a mano en pantalla completa "solo radar" (pedido de Sd, 2026-09-21). */
.recorridos{position:absolute;left:16px;bottom:12px;z-index:6;display:flex;gap:14px;align-items:flex-end}
.recorridos button{position:relative;width:46px;height:46px;border-radius:50%;border:2px solid var(--c);background:rgba(10,20,33,.85);color:var(--c);cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 22px rgba(0,0,0,.55),0 0 0 4px color-mix(in srgb,var(--c) 14%,transparent);transition:transform .15s,background .15s,color .15s}
.recorridos button svg{width:20px;height:20px;fill:currentColor;margin-left:3px}
.recorridos button:hover,.recorridos button.activo{background:var(--c);color:#0a1421;transform:scale(1.06)}
.recorridos button.activo{box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 35%,transparent),0 0 18px var(--c)}
.recorridos button span{position:absolute;top:50px;left:50%;transform:translateX(-50%);font:700 10px var(--cond);letter-spacing:.16em;text-transform:uppercase;color:var(--texto2);white-space:nowrap}
.recorridos{padding-bottom:16px}
aside h2{margin:0 0 4px;font:700 24px/1 var(--cond);letter-spacing:.03em;text-transform:uppercase}
aside .zona{color:var(--texto3);font-size:10px;text-transform:uppercase;letter-spacing:.14em}
aside .estado{display:inline-block;margin:8px 6px 10px 0;padding:2px 9px;border-radius:999px;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;border:1px solid}
.e-activo{color:var(--verde);border-color:var(--verde)} .e-planeado{color:#6b7a94;border-color:#6b7a94}
.e-manual{color:var(--rosa);border-color:var(--rosa)} .e-parcial{color:var(--miel);border-color:var(--miel)}
.e-pago{color:#111;background:var(--miel);border-color:var(--miel)}
aside ul{padding-left:18px;margin:0 0 10px;color:var(--texto2);font-size:13px} aside li{margin:4px 0}
aside dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 10px;font-size:12.5px} aside dt{color:var(--texto3)} aside dd{margin:0}
aside .vacio{color:var(--texto3);font-style:italic;font-size:13px}
aside button{background:var(--cian);color:#0a1421;border:0;border-radius:6px;padding:6px 12px;font:600 12.5px var(--body);cursor:pointer;margin:4px 6px 4px 0}
aside button.sec{background:transparent;color:var(--texto2);border:1px solid var(--linea)}
aside .paso-actual{font-size:14px;line-height:1.4;margin:10px 0;padding:10px 12px;border-left:3px solid var(--neon);background:rgba(255,255,255,.03)}
aside ol.recorrido{padding-left:18px;color:var(--texto3);font-size:11.5px} aside ol.recorrido li{margin:2px 0}
.pie{display:flex;gap:14px;flex-wrap:wrap;margin-top:6px;color:var(--texto3);font-size:11px;align-items:center;flex:none}
.pie i{display:inline-block;width:12px;height:12px;border-radius:3px;background:var(--c);vertical-align:middle;margin-right:5px;opacity:.9}
.pie .pago i{border-radius:50%;background:var(--miel)} .pie .pago.fut i{background:none;border:1.5px dashed var(--miel)} .pie .pl i{background:none;border:1px dashed #6b7a94;border-radius:0;height:0;width:22px}
@media (max-width:1100px){aside{width:min(340px,calc(100vw - 32px))}}
</style>
</head>

<div class="marco">
  <header>
    <div class="marca">
      <img src="{{ '/logo-plataforma-oscuro' if marca_plataforma and marca_plataforma.logo_oscuro else ('/logo-plataforma' if marca_plataforma and marca_plataforma.logo else '/static/logo_mitrabajo.svg') }}" alt="Colm3na">
      <h1><em>Sala de mando</em></h1>
    </div>
    <div class="estado-ctl" id="estadoCtl">estado general
      <button data-e="verde" style="--c:#3ec9a7" title="Todo en línea"></button>
      <button data-e="amarillo" style="--c:#f2b234" title="Degradado"></button>
      <button data-e="rojo" style="--c:#ff4d5a" title="Con errores"></button>
      <button data-e="violeta" style="--c:#b3b2e8" title="Sistema caído"></button>
      <span id="estadoTxt"></span><small id="actualizado" style="margin-left:10px;color:var(--texto3);letter-spacing:0;text-transform:none"></small>
    </div>
  </header>

  <div class="cuerpo">
    <div class="radar" id="radar" data-estado="verde">
      <div class="barrido"></div>
      <div class="foco"></div>
      <div class="recorridos" id="recorridos" aria-label="Recorridos"></div>
      <svg id="svg" viewBox="0 0 1440 880" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <div class="pie" id="pie"><span class="pago"><i></i>pago hoy</span><span class="pago fut"><i></i>será pago</span><span class="pl"><i></i>planeado / manual · pelotitas: tráfico real</span><span style="color:var(--texto3)" id="fuente-cifras">· las cifras salen de la base de este entorno; el semáforo, de Grafana</span></div>
  </div>

  <aside id="ficha"></aside>
</div>

// Logos vendoreados (static/marcas.svg, Simple Icons CC0) y el isotipo de ARCA, con sello de /static.
const MARCAS_URL = "/static/marcas.svg?v={{ sello_static('marcas.svg') }}";
const ARCA_URL = "/static/marcas/arca.png?v={{ sello_static('marcas/arca.png') }}";

<script>
{% raw %}
// ============================ DATOS ============================

  else {
    g.append(el("rect", {x:n.x, y:n.y+8, width:3, height:n.h-16, rx:1.5, fill:col}));  // franja de zona

for (const n of NODOS.filter(n => !n.padre)) capaN.append(dibujarNodo(n));

function ancla(spec) {
  const m = spec.match(/^(\w+)\.([trbl])(?:\(([\d.]+)\))?$/);
  const n = porId[m[1]], f = m[3] != null ? parseFloat(m[3]) : .5;
  return {t:{x:n.x+n.w*f, y:n.y, dx:0, dy:-1}, b:{x:n.x+n.w*f, y:n.y+n.h, dx:0, dy:1}, l:{x:n.x, y:n.y+n.h*f, dx:-1, dy:0}, r:{x:n.x+n.w, y:n.y+n.h*f, dx:1, dy:0}}[m[2]];
}
function bezier(a, b) {

  return {d:`M${a.x},${a.y} C${c1.x},${c1.y} ${c2.x},${c2.y} ${b.x},${b.y}`, mid:{x:(a.x+3*c1.x+3*c2.x+b.x)/8, y:(a.y+3*c1.y+3*c2.y+b.y)/8}};
}
const defs = el("defs", {}); svg.prepend(defs);

const marcadores = {};
function marcador(col) { if (marcadores[col]) return marcadores[col]; const id = "f" + Object.keys(marcadores).length; const mk = el("marker", {id, viewBox:"0 0 10 10", refX:9, refY:5, markerWidth:6, markerHeight:6, orient:"auto-start-reverse"}); mk.append(el("path", {d:"M0,0 L10,5 L0,10 z", fill:col})); defs.append(mk); return marcadores[col] = id; }

for (const a of ARISTAS) {
  const col = colorArista(a);
  let d, mid;
  if (a.pts) { d = "M" + a.pts.map(p => p.join(",")).join(" L"); mid = a.labelEn ? {x:a.labelEn[0], y:a.labelEn[1]} : {x:a.pts[1][0], y:a.pts[1][1]}; }
  else { const r = bezier(ancla(a.de), ancla(a.a)); d = r.d; mid = a.labelEn ? {x:a.labelEn[0], y:a.labelEn[1]} : r.mid; }
  const p = el("path", {id:"ar-"+a.id, d, fill:"none", stroke:col, "stroke-width":1.5, "marker-end":`url(#${marcador(col)})`, opacity:.85, "data-arista":a.id});
  if (a.tipo === "planeado") p.setAttribute("stroke-dasharray", "6 5");
  if (a.tipo === "manual") p.setAttribute("stroke-dasharray", "2 4");
  capaA.append(p);
  if (a.bolas) {  // pelotitas circulando
    const largo = p.getTotalLength(), dur = Math.max(3, largo / 70), n = Math.max(1, Math.round(largo / 220));
    for (let i = 0; i < n; i++) {
      const c = el("circle", {r:3, fill:col, opacity:.95}); c.append(el("animateMotion", {dur:dur+"s", repeatCount:"indefinite", begin:(-dur*i/n)+"s"}));
      c.lastChild.append(el("mpath", {href:"#ar-"+a.id})); capaB.append(c);
    }
  }
  if (a.label) {
    const t = el("text", {x:mid.x, y:mid.y+3.5, class:"a-label", "text-anchor":"middle", transform:a.rot ? `rotate(${a.rot} ${mid.x} ${mid.y})` : ""}, a.label);
    capaL.append(t);

const ESTADOS = {verde:{c:"#3ec9a7", t:"todo en línea", env:"EN LÍNEA"}, amarillo:{c:"#f2b234", t:"degradado", env:"DEGRADADO"}, rojo:{c:"#ff4d5a", t:"con errores", env:"CON ERRORES"}, violeta:{c:"#b3b2e8", t:"sistema caído", env:"CAÍDO"}, gris:{c:"#6b7a94", t:"sin vigilancia configurada", env:"SIN DATO"}};

// ---- datos vivos: los inyecta el servidor al dibujar y el navegador los
// refresca cada minuto pidiendo /api/entornos/esquema (que suma el semáforo
// de Grafana). Si el pedido falla, el estado pasa a violeta: la app no responde.
// Los indicadores de negocio se mudaron a la pastilla "Observación técnica" de
// /entornos (2026-09-21): la Sala es solo el radar. De /api/entornos/esquema
// toma el semáforo de Grafana y la hora; si el pedido falla, violeta.
function aplicarDatos(d) {
  if (!d) return;
  if (d.telegram && porId.telegram && porId.telegram.estado !== "activo") {   // el bot ya avisa: deja de ser una idea
    porId.telegram.estado = "activo"; porId.telegram.pagoFuturo = undefined;
    porId.telegram.ficha = {notas:["Configurado: recibe las alertas de Grafana por su propio punto de contacto, cada error no previsto al instante (freno de 10 minutos por código) y el resumen del día a la hora fija de Buenos Aires.","Sin datos de personas: los mismos campos que Sentry.","Se configura con TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID; la hora, con TELEGRAM_RESUMEN_HORA."], campos:{"Costo":"0"}};
    const g = nodeG("telegram");
    if (g) {
      g.classList.remove("planeado");
      const subs = g.querySelectorAll("text.s"), textos = ["alertas · errores · resumen", "al teléfono del equipo"];
      subs.forEach((t, i) => { t.textContent = textos[i] || ""; if (t.textContent === "PLANEADO") t.remove(); });
      [...g.querySelectorAll("text")].filter(t => t.textContent === "PLANEADO").forEach(t => t.remove());
    }
    const a = capaA.querySelector('[data-arista="grafana-tg"]'); if (a) { a.removeAttribute("stroke-dasharray"); a.setAttribute("stroke", ZONAS.obs.color); }
    [...capaL.querySelectorAll("text")].filter(t => t.textContent === "idea").forEach(t => { t.textContent = "alertas"; });
  }
  setEstado(d.semaforo && ESTADOS[d.semaforo] ? d.semaforo : "gris");
  const act = document.getElementById("actualizado"); if (act) act.textContent = "· " + (d.actualizado || "");
}
const inicial = document.getElementById("datos-vivos");
if (inicial) {
  try { aplicarDatos(JSON.parse(inicial.textContent)); } catch (e) {}
  const refrescar = () => fetch("/api/entornos/esquema", {credentials:"same-origin"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(aplicarDatos).catch(() => setEstado("violeta"));
  refrescar(); setInterval(refrescar, 60000);
}

// ============================ FICHA, ZOOM Y CLIC ============================
const ficha = document.getElementById("ficha");
let fijado = null, zoomado = null, anim = null;
function ubicarFicha(n) {
  // Del lado contrario a la caja, para no taparla; a la derecha si no hay caja (recorridos).
  const g = n ? nodeG(n.id) : null;
  const r = g ? g.getBoundingClientRect() : null;
  const izquierda = r ? (r.left + r.width / 2) > window.innerWidth / 2 : false;
  ficha.style.left = izquierda ? "22px" : ""; ficha.style.right = izquierda ? "" : "22px";
  ficha.style.top = r ? Math.max(70, Math.min(r.top, window.innerHeight - 80 - Math.min(ficha.offsetHeight || 300, window.innerHeight - 110))) + "px" : "70px";
  ficha.classList.add("visible");
}
function ocultarFicha() { if (fijado || anim) return; ficha.classList.remove("visible", "fija"); }
function mostrarFicha(n) {
  if (anim || (fijado && fijado !== n)) return;
  const f = n.ficha || {};
  const campos = Object.entries(f.campos || {}).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");
  const plays = (n.plays || []).map(p => `<button data-play="${p.id}">▶ ${p.titulo}</button>`).join("");
  const zona = n.z ? ZONAS[n.z].nombre : (n.padre ? porId[n.padre].t : "");
  ficha.innerHTML = `<div class="zona">${zona}</div><h2>${n.t}</h2>
    <span class="estado e-${n.estado || "activo"}">${n.estado || "activo"}</span>${n.pago ? `<span class="estado e-pago">$ ${n.pago}</span>` : ""}${n.pagoFuturo ? `<span class="estado e-parcial">$ será pago: ${n.pagoFuturo}</span>` : ""}
    <ul>${(f.notas || []).map(x => `<li>${x}</li>`).join("")}</ul>
    ${campos ? `<dl>${campos}</dl>` : ""}
    ${(n.vencimientos || []).length ? `<dl>${n.vencimientos.map(v => `<dt>Vence</dt><dd>${v.fecha} · ${v.que} (aviso ${v.aviso} días antes)</dd>`).join("")}</dl>` : ""}
    ${plays ? `<div>${plays}</div>` : ""}
    ${fijado ? `<p class="vacio">Fijada. Otro clic en la caja, o en el fondo, la suelta.</p>` : ""}`;
  ficha.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => animar(b.dataset.play)));
  ficha.classList.toggle("fija", !!fijado);
  ubicarFicha(n);
}
function fichaInicial() {
  fijado = null;
  ficha.classList.remove("visible", "fija");
}
// Los tres recorridos, como botones en la cabecera.
const recorridosEl = document.getElementById("recorridos");
const ROTULOS = {recibo:"Recibo", error:"Error", equipo:"Código"};
recorridosEl.innerHTML = Object.entries(RECORRIDOS).map(([k, r]) => `<button data-play="${k}" style="--c:${r.color}" title="${r.titulo}" aria-label="${r.titulo}"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg><span>${ROTULOS[k] || k}</span></button>`).join("");
recorridosEl.querySelectorAll("[data-play]").forEach(b => b.addEventListener("click", () => animar(b.dataset.play)));
function desZoom() { if (zoomado) { zoomado.removeAttribute("transform"); zoomado.classList.remove("zoom", "fijo"); zoomado = null; } }
function alClic(n) {
  if (anim) return;
  const g = nodeG(n.id);
  if (zoomado === g) { desZoom(); fichaInicial(); return; }
  desZoom();
  const F = 1.4, cx = n.x + n.w/2, cy = n.y + n.h/2;
  let dx = 0, dy = 0;
  const l = cx - n.w*F/2, r = cx + n.w*F/2, t = cy - n.h*F/2, b = cy + n.h*F/2;
  if (l < 8) dx = 8 - l; if (r > 1432) dx = 1432 - r; if (t < 8) dy = 8 - t; if (b > 872) dy = 872 - b;
  g.setAttribute("transform", `translate(${cx+dx} ${cy+dy}) scale(${F}) translate(${-cx} ${-cy})`);
  g.classList.add("zoom", "fijo"); (n.padre ? nodeG(n.padre) : capaN).append(g); zoomado = g;
  fijado = null; mostrarFicha(n); fijado = n; mostrarFicha(n);
}
svg.addEventListener("click", () => { if (anim) return; desZoom(); fichaInicial(); });

function animar(id) {
  detener(); desZoom();
  const rec = RECORRIDOS[id];
  document.documentElement.style.setProperty("--neon", rec.color);
  svg.classList.add("animando");
  recorridosEl.querySelectorAll("[data-play]").forEach(b => b.classList.toggle("activo", b.dataset.play === id));
  anim = {rec, i:0, timer:null}; paso();
}
const elementosDe = p => [...(p.n || []).map(nodeG), ...(p.e || []).map(id => capaA.querySelector(`[data-arista="${id}"]`))].filter(Boolean);
function paso() {
  const {rec, i} = anim;
  if (i > 0) elementosDe(rec.pasos[i-1]).forEach(e => { e.classList.remove("neon"); e.classList.add("paso"); });
  if (i >= rec.pasos.length) { anim.timer = setTimeout(finAnim, 3000); pintarAside(true); return; }
  const p = rec.pasos[i];
  elementosDe(p).forEach(e => { e.classList.add("neon"); if (e.classList.contains("nodo") && !e.parentElement.classList.contains("nodo")) capaN.append(e); });
  anim.i++; pintarAside(false);
  anim.timer = setTimeout(paso, p.ms || 2200);
}
function pintarAside(fin) {
  const {rec, i} = anim, actual = rec.pasos[i-1];
  ficha.classList.add("visible", "fija"); ficha.style.left = ""; ficha.style.right = "22px"; ficha.style.top = "70px";
  ficha.innerHTML = `<div class="zona">Recorrido · ${fin ? "fin" : `paso ${i} de ${rec.pasos.length}`}</div><h2 style="color:${rec.color}">${rec.titulo}</h2>
    <div class="paso-actual" style="border-color:${rec.color}">${fin ? "Eso es todo lo que toca. Cada caja del recorrido quedó encendida." : actual.t}</div>
    <button data-det class="sec">${fin ? "Cerrar" : "Detener"}</button><button data-rep class="sec">Repetir</button>
    <ol class="recorrido">${rec.pasos.slice(0, fin ? rec.pasos.length : i-1).map(p => `<li>${p.t}</li>`).join("")}</ol>`;
  ficha.querySelector("[data-det]").addEventListener("click", () => { detener(); fichaInicial(); });
  ficha.querySelector("[data-rep]").addEventListener("click", () => animar(Object.keys(RECORRIDOS).find(k => RECORRIDOS[k] === rec)));
}
function limpiarNeon() { svg.querySelectorAll(".neon, .paso").forEach(e => e.classList.remove("neon", "paso")); svg.classList.remove("animando"); recorridosEl.querySelectorAll(".activo").forEach(b => b.classList.remove("activo")); }
function finAnim() { limpiarNeon(); anim = null; fichaInicial(); }
function detener() { if (anim) { clearTimeout(anim.timer); anim = null; } limpiarNeon(); }
fichaInicial();

// Pantalla completa "solo radar": sin barra del navegador ni del sistema, sin
// cabecera ni tarjetas. Embebida, la pide el PADRE sobre su capa (la activación
// del usuario dentro del iframe alcanza a los ancestros del mismo origen) y avisa
// por mensaje cuando entra o sale; suelta, la pide esta misma página.
const EMBEBIDA = window.parent && window.parent !== window;
const avisarPadre = m => window.parent.postMessage(Object.assign({sala:"x"}, m), location.origin);
function soloRadar(on) {
  document.body.classList.toggle("en-fullscreen", !!on);
  if (!EMBEBIDA) document.body.classList.toggle("solo-radar", !!on);   // embebida ya es solo radar siempre
  desZoom(); fichaInicial();
}
function enFullscreen() { return document.body.classList.contains("en-fullscreen"); }
document.getElementById("pantalla").addEventListener("click", () => {
  if (EMBEBIDA) avisarPadre({sala:"fullscreen"});
  else if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
});
// Volver: embebida, le pide a la landing que cierre (sale del fullscreen y deja
// abierta la pastilla "Observación técnica"); suelta, sale de la pantalla completa
// si está en ella y si no vuelve a /entornos. Solo se habla con el mismo origen.
document.getElementById("volver").addEventListener("click", () => {
  if (EMBEBIDA) { avisarPadre({sala:"cerrar"}); return; }
  if (enFullscreen() && document.fullscreenElement) { document.exitFullscreen(); return; }
  location.href = "/entornos";
});
document.addEventListener("fullscreenchange", () => { if (!EMBEBIDA) soloRadar(!!document.fullscreenElement); });
window.addEventListener("message", ev => {
  if (ev.origin !== location.origin || !ev.data || ev.data.sala !== "solo-radar") return;
  soloRadar(ev.data.on);
});

// foco de luz que sigue al puntero (mismo mecanismo que el login, más chico y más sutil)
(function () {
  if (!window.matchMedia("(hover:hover)").matches || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const radar = document.getElementById("radar");
  radar.addEventListener("mousemove", ev => {
    const r = radar.getBoundingClientRect();
    radar.style.setProperty("--mx", (ev.clientX - r.left) + "px");
    radar.style.setProperty("--my", (ev.clientY - r.top) + "px");
    radar.classList.add("con-foco");
  });
  radar.addEventListener("mouseleave", () => radar.classList.remove("con-foco"));
})();
