<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Trabajo — Elegí el sindicato</title>
<style>
  :root {
    --tinta: {{ marca_plataforma.color_primario if marca_plataforma else '#152238' }};
    --agua: {{ marca_plataforma.color_secundario if marca_plataforma else '#1a7a6b' }};
    --papel:#f7f5f0; --linea:#dcd8cf; --gris:#5c5a54;
  }
  * { box-sizing:border-box; margin:0; font-family:system-ui,sans-serif; }
  body { background:var(--papel); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:30px 26px; max-width:400px; width:100%; }
  .logo-recuadro { display:block; width:76px; height:76px; object-fit:contain; margin:0 auto 16px; }
  @media (max-width:600px) { .logo-recuadro { width:61px; height:61px; } }
  h1 { font-size:16px; color:var(--gris); font-weight:500; margin-bottom:20px; text-align:center; }
  a.sind { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border:1px solid var(--linea); border-radius:12px; text-decoration:none; color:var(--tinta); font-size:16px; font-weight:500; margin-bottom:10px; transition:border-color .15s; }
  a.sind:hover { border-color:var(--agua); background:#f9fdfc; }
  a.sind .fl { color:var(--gris); }
  .btn-cerrar { position:fixed; bottom:20px; right:20px; width:42px; height:42px; border-radius:50%;
    background:#e3b6b8; color:#7a2e35; display:flex; align-items:center; justify-content:center;
    font-size:18px; font-weight:600; text-decoration:none; box-shadow:0 2px 10px rgba(0,0,0,.15); z-index:40; }
  .btn-cerrar:hover { background:#d9a3a6; }
</style>
</head>
<body>
{% include "_entorno.html" %}
  <div class="caja">
    <img class="logo-recuadro" src="{{ '/logo-plataforma' if marca_plataforma and marca_plataforma.logo else '/static/logo_mitrabajo.svg' }}" alt="Mi Trabajo">
    <h1>Estás dado de alta en varios sindicatos. ¿A cuál querés entrar?</h1>
    {% for s in sindicatos %}
    <a class="sind" href="/empresa/elegir/{{ s.id }}">
      <span>{{ s.nombre }}</span>
      <span class="fl">→</span>
    </a>
    {% endfor %}
  </div>
  <a class="btn-cerrar" href="/empresa/salir" title="Salir" aria-label="Salir">✕</a>
</body>
</html>
