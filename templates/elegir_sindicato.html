<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Trabajo — Elegí tu sindicato</title>
<style>
  :root { --tinta:#152238; --agua:#1a7a6b; --papel:#f7f5f0; --linea:#dcd8cf; --gris:#5c5a54; }
  * { box-sizing:border-box; margin:0; font-family:system-ui,sans-serif; }
  body { background:var(--papel); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:30px 26px; max-width:400px; width:100%; }
  .marca { display:flex; align-items:center; gap:10px; margin-bottom:8px; justify-content:center; }
  .marca img { width:32px; height:32px; }
  .marca .nom { font-size:19px; font-weight:600; color:var(--tinta); }
  h1 { font-size:16px; color:var(--gris); font-weight:500; margin-bottom:20px; text-align:center; }
  a.sind { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; border:1px solid var(--linea); border-radius:12px; text-decoration:none; color:var(--tinta); font-size:16px; font-weight:500; margin-bottom:10px; transition:border-color .15s; }
  a.sind:hover { border-color:var(--agua); background:#f9fdfc; }
  a.sind .fl { color:var(--gris); }
  .pie { text-align:center; margin-top:16px; }
  .pie a { color:var(--gris); font-size:13px; text-decoration:none; }
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">
      <img src="/static/logo_mitrabajo.svg" alt="Mi Trabajo">
      <span class="nom">Mi Trabajo</span>
    </div>
    <h1>Estás en varios sindicatos. ¿A cuál querés entrar?</h1>
    {% for s in sindicatos %}
    <a class="sind" href="/app/elegir/{{ s.id }}">
      <span>{{ s.nombre }}</span>
      <span class="fl">→</span>
    </a>
    {% endfor %}
    <div class="pie"><a href="/trabajador/salir">Salir</a></div>
  </div>
</body>
</html>
