<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi Trabajo — Administración de plataforma</title>
<style>
  :root { --tinta:#152238; --agua:#1a7a6b; --papel:#f7f5f0; --linea:#dcd8cf; --gris:#5c5a54; --alerta:#b23a2e; }
  * { box-sizing:border-box; margin:0; font-family:system-ui,sans-serif; }
  body { background:var(--papel); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .caja { background:#fff; border:1px solid var(--linea); border-radius:16px; padding:34px 30px; max-width:380px; width:100%; }
  .marca { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .marca img { width:34px; height:34px; }
  .marca .nom { font-size:19px; font-weight:600; color:var(--tinta); }
  h1 { font-size:16px; color:var(--gris); font-weight:500; margin-bottom:22px; }
  label { display:block; font-size:13px; color:var(--gris); margin-bottom:6px; }
  input { width:100%; padding:11px 13px; border:1px solid #ccc; border-radius:9px; font-size:15px; font-family:inherit; }
  input:focus { outline:2px solid #b9d6ce; border-color:var(--agua); }
  button { width:100%; margin-top:16px; padding:12px; background:var(--tinta); color:#fff; border:none; border-radius:9px; font-size:15px; font-weight:500; cursor:pointer; font-family:inherit; }
  .error { background:#f8e5e2; color:var(--alerta); font-size:13px; padding:10px 13px; border-radius:8px; margin-bottom:16px; }
</style>
</head>
<body>
  <div class="caja">
    <div class="marca">
      <img src="/static/logo_mitrabajo.svg" alt="Mi Trabajo">
      <span class="nom">Mi Trabajo</span>
    </div>
    <h1>Administración de plataforma</h1>
    {% if request.query_params.get('error') %}
    <div class="error">Clave incorrecta. Probá de nuevo.</div>
    {% endif %}
    <form method="post" action="/plataforma/login">
      <label for="cuit">CUIT / CUIL</label>
      <input type="text" id="cuit" name="cuit" inputmode="numeric" placeholder="20123456789" autofocus required style="margin-bottom:14px;">
      <label for="clave">Clave de plataforma</label>
      <input type="password" id="clave" name="clave" required>
      <button type="submit">Ingresar</button>
    </form>
  </div>
</body>
</html>
