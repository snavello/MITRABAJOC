<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="{{ marca.color_base if marca else (marca_plataforma.color_primario if marca_plataforma else '#152238') }}">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mi Trabajo — Empresa</title>
<style>
  :root {
    --tinta:#152238; --agua:#1a7a6b; --alerta:#b23a2e;
    --papel:#f7f5f0; --linea:#dcd8cf; --gris:#5c5a54; --card:#ffffff;
    --marca-base: {{ marca.color_base if marca else (marca_plataforma.color_primario if marca_plataforma else '#152238') }};
    --marca-primario: {{ marca.color_primario if marca else (marca_plataforma.color_primario if marca_plataforma else '#152238') }};
    --marca-acento: {{ marca.color_acento if marca else (marca_plataforma.color_acento if marca_plataforma else '#b23a2e') }};
    --marca-apoyo: {{ marca.color_secundario if marca else (marca_plataforma.color_secundario if marca_plataforma else '#1a7a6b') }};
  }
  * { box-sizing:border-box; margin:0; -webkit-tap-highlight-color:transparent; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--papel); color:var(--tinta);
    line-height:1.5; min-height:100dvh; padding-bottom:env(safe-area-inset-bottom); }
  header { background:var(--marca-base); border-bottom:1px solid var(--linea);
    padding:12px 18px; padding-top:calc(12px + env(safe-area-inset-top));
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    position:sticky; top:0; z-index:10; }
  .logo-plataforma-header { width:76px; height:76px; object-fit:contain; flex-shrink:0; }
  .sind { max-height:76px; max-width:200px; object-fit:contain; }
  @media (max-width:600px) {
    .logo-plataforma-header { width:61px; height:61px; }
    .sind { max-height:61px; max-width:160px; }
  }
  .sind-nombre-header { color:#fff; font-size:14px; font-weight:600; }
  .btn-flotante { position:fixed; bottom:84px; right:18px; width:42px; height:42px; border-radius:50%;
    background:var(--marca-base); display:flex; align-items:center; justify-content:center;
    text-decoration:none; border:1px solid rgba(255,255,255,.14);
    box-shadow:0 2px 10px rgba(0,0,0,.25); z-index:40; }
  .btn-flotante svg { width:19px; height:19px; stroke:#fff; stroke-width:2.6; fill:none; }
  .btn-flotante:hover { opacity:.85; }
  .cont { max-width:480px; margin:0 auto; padding:22px 20px 40px; padding-bottom:98px; }
  h1 { font-size:clamp(21px, 5.5vw, 26px); font-weight:600; letter-spacing:-0.5px; }
  .sub { color:var(--gris); margin-top:6px; font-size:15px; }
  .card { background:var(--card); border:1px solid var(--linea); border-radius:12px; padding:16px 18px; margin-top:16px; }
  .tpanel { display:none; }
  .tpanel.activo { display:block; }
  .proximamente { text-align:center; padding:60px 24px; color:var(--gris); }
  .proximamente .ic-grande svg { width:52px; height:52px; stroke:var(--marca-apoyo); stroke-width:1.5; fill:none; opacity:.55; }
  .proximamente h2 { font-size:18px; color:var(--tinta); margin:16px 0 8px; }
  .proximamente p { font-size:14px; line-height:1.5; }
  /* ===== Pestañas (barra inferior), mismo patrón que trabajador.html ===== */
  .tabbar { position:fixed; bottom:0; left:0; right:0; background:#fff;
    border-top:1px solid var(--linea); display:flex; z-index:30;
    padding-bottom:env(safe-area-inset-bottom); }
  .tabbar button { flex:1; background:none; border:none; padding:8px 2px 7px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-family:inherit; cursor:pointer; color:#8a887f; font-size:11px; font-weight:500; }
  .tabbar button .picon { width:42px; height:28px; border-radius:14px;
    display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .tabbar button svg { width:22px; height:22px; stroke-width:1.7; fill:none;
    stroke:#8a887f; transition:stroke .15s; }
  .tabbar button.activa { color:var(--marca-acento); }
  .tabbar button.activa .picon { background:color-mix(in srgb, var(--marca-acento) 15%, transparent); }
  .tabbar button.activa svg { stroke:var(--marca-acento); }
  .tabbar button { position:relative; }
  .tab-badge { position:absolute; top:2px; right:14px; background:#e5484d; color:#fff;
    font-size:10px; font-weight:700; min-width:16px; height:16px; border-radius:999px;
    display:flex; align-items:center; justify-content:center; padding:0 3px; }
  /* ===== Notificaciones -- mismo patrón que portada.html (trabajador), sin
     modal: acá la pestaña ya ES el contenido, no compite por espacio con
     nada más en la pantalla. ===== */
  .notif-item { background:var(--papel); border:1px solid var(--linea); border-left:3px solid transparent;
    border-radius:10px; padding:11px 13px; margin-bottom:8px; cursor:pointer; }
  .notif-item.no-leida { border-left-color:var(--marca-acento);
    background:color-mix(in srgb, var(--marca-acento) 7%, var(--papel)); }
  .notif-cab { display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .notif-remitente { font-size:12.5px; font-weight:650; color:var(--marca-primario); }
  .notif-item.no-leida .notif-remitente { color:var(--marca-acento); }
  .notif-fecha { font-size:10.5px; color:var(--gris); white-space:nowrap; }
  .notif-snippet { font-size:12.5px; color:var(--gris); margin-top:4px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .notif-texto-full { font-size:13px; line-height:1.55; margin-top:8px; color:var(--tinta); display:none; }
  .notif-item.expandido .notif-snippet { display:none; }
  .notif-item.expandido .notif-texto-full { display:block; }
  .notif-adjunto { display:inline-block; margin-top:9px; font-size:12px; color:var(--marca-primario);
    text-decoration:none; font-weight:600; }
  .notif-vacio { text-align:center; padding:34px 10px; color:var(--gris); font-size:13px; }
</style>
</head>
<body>
<header>
  <img class="logo-plataforma-header" src="{{ '/logo-plataforma' if marca_plataforma and marca_plataforma.logo else '/static/logo_mitrabajo.svg' }}" alt="Mi Trabajo">
  {% if marca and marca.logo %}
  <img class="sind" src="/logo/{{ marca.id }}?v={{ marca.logo_v }}" alt="{{ sindicato }}">
  {% else %}
  <span class="sind-nombre-header">{{ sindicato }}</span>
  {% endif %}
</header>

<div class="cont">
  <h1>{{ razon_social or cuit }}</h1>
  <div class="sub">CUIT {{ cuit }} · {{ sindicato }}</div>

  <!-- ============ PESTAÑA: NOTIFICACIONES ============ -->
  <div class="tpanel activo" id="tp-notificaciones">
    <div id="notif-lista"><div class="notif-vacio">Cargando…</div></div>
  </div>

  <!-- ============ PESTAÑA: TRÁMITES ============ -->
  <div class="tpanel" id="tp-tramites">
    <div class="proximamente">
      <div class="ic-grande"><svg viewBox="0 0 24 24"><use href="#ic-tramites"/></svg></div>
      <h2>Trámites</h2>
      <p>Acá vas a poder completar y enviar los formularios que te pida el sindicato.</p>
    </div>
  </div>
</div>

<nav class="tabbar">
  <button class="tab-t activa" data-tp="notificaciones">
    <span class="picon"><svg viewBox="0 0 24 24"><use href="#ic-notif"/></svg></span>
    Notificaciones
    <span class="tab-badge" id="badge-notif-emp" style="display:none;"></span>
  </button>
  <button class="tab-t" data-tp="tramites"><span class="picon"><svg viewBox="0 0 24 24"><use href="#ic-tramites"/></svg></span>Trámites</button>
</nav>

<a class="btn-flotante" href="/empresa/salir" title="Salir" aria-label="Salir">
  <svg viewBox="0 0 24 24"><use href="#ic-x"/></svg>
</a>

<!-- Íconos SVG de línea -->
<svg style="display:none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <g id="ic-notif"><path d="M6 10a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6z"/><path d="M9.5 19a2.5 2.5 0 0 0 5 0"/></g>
    <g id="ic-tramites"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9 14 2 2 4-4"/></g>
    <g id="ic-x"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></g>
  </defs>
</svg>

<script>
document.querySelectorAll('.tab-t').forEach(btn => {
  btn.addEventListener('click', () => {
    const dest = btn.dataset.tp;
    document.querySelectorAll('.tab-t').forEach(b => b.classList.toggle('activa', b === btn));
    document.querySelectorAll('.tpanel').forEach(pan => {
      pan.classList.toggle('activo', pan.id === 'tp-' + dest);
    });
  });
});

// ---------- Notificaciones ----------
function fmtFechaHora(s) {
  // "AAAA-MM-DD HH:MM" -> "DD/MM HH:MM"
  const m = /^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2})$/.exec(s || '');
  return m ? `${m[3]}/${m[2]} ${m[4]}` : (s || '');
}
async function cargarNotificacionesEmpresa() {
  const lista = document.getElementById('notif-lista');
  try {
    const r = await fetch('/api/empresa/notificaciones');
    if (!r.ok) throw new Error();
    const data = await r.json();
    renderNotificacionesEmpresa(data.notificaciones);
    actualizarBadgeNotifEmpresa(data.no_leidas);
  } catch (e) {
    lista.innerHTML = '<div class="notif-vacio">No se pudieron cargar las notificaciones.</div>';
  }
}
function renderNotificacionesEmpresa(items) {
  const lista = document.getElementById('notif-lista');
  if (!items.length) {
    lista.innerHTML = '<div class="notif-vacio">Todavía no tenés notificaciones.</div>';
    return;
  }
  lista.innerHTML = items.map(n => `
    <div class="notif-item ${n.leida_en ? '' : 'no-leida'}" data-id="${n.id}" onclick="toggleNotificacionEmpresa(${n.id})">
      <div class="notif-cab">
        <span class="notif-remitente">${(n.remitente || 'Tu sindicato').replace(/</g, '&lt;')}</span>
        <span class="notif-fecha">${fmtFechaHora(n.enviado_en)}</span>
      </div>
      <div class="notif-snippet">${(n.texto || '').replace(/</g, '&lt;')}</div>
      <div class="notif-texto-full">${n.texto_html}${n.tiene_adjunto ? `<br><a class="notif-adjunto" href="/notificacion-empresa-adjunto/${n.id}" target="_blank" rel="noopener" onclick="event.stopPropagation()">📎 Ver adjunto</a>` : ''}</div>
    </div>
  `).join('');
}
async function toggleNotificacionEmpresa(id) {
  const item = document.querySelector('.notif-item[data-id="' + id + '"]');
  if (!item) return;
  const yaExpandido = item.classList.contains('expandido');
  document.querySelectorAll('.notif-item.expandido').forEach(el => el.classList.remove('expandido'));
  if (yaExpandido) return;
  item.classList.add('expandido');
  if (item.classList.contains('no-leida')) {
    item.classList.remove('no-leida');
    try {
      const r = await fetch('/api/empresa/notificacion/' + id + '/leer', { method: 'POST' });
      const data = await r.json();
      actualizarBadgeNotifEmpresa(data.no_leidas);
    } catch (e) {}
  }
}
function actualizarBadgeNotifEmpresa(n) {
  const badge = document.getElementById('badge-notif-emp');
  if (!badge) return;
  if (n > 0) { badge.textContent = n; badge.style.display = 'flex'; }
  else { badge.style.display = 'none'; }
}
cargarNotificacionesEmpresa();
</script>
</body>
</html>
